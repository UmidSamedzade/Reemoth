[package]
name = "reemoth"
description = "Low-latency P2P remote desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
reemoth-proto.workspace = true
reemoth-auth.workspace = true
reemoth-net.workspace = true
reemoth-video.workspace = true
reemoth-input.workspace = true
anyhow.workspace = true
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
clap.workspace = true
directories = "6"
futures-util.workspace = true
png = "0.17"
pollster = "0.4"
rpassword = "7"
# TLS for wss:// signaling. aws-lc-rs is already linked via str0m.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "signal", "sync"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
yuv = "0.8.19"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "25"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange"] }

[lints]
workspace = true
