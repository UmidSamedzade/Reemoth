[package]
name = "reemoth-signaling"
description = "Reemoth signaling server (Cloudflare Worker + Durable Objects)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reemoth-proto = { path = "../crates/reemoth-proto" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0.229", features = ["derive"] }
worker = "0.8.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[workspace]
