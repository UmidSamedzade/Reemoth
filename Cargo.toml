[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# The signaling Worker targets wasm32 and has its own workspace.
exclude = ["signaling"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UmidSamedzade/Reemoth"
rust-version = "1.88"

[workspace.dependencies]
reemoth-proto = { path = "crates/reemoth-proto" }
reemoth-auth = { path = "crates/reemoth-auth" }
reemoth-net = { path = "crates/reemoth-net" }
reemoth-video = { path = "crates/reemoth-video" }
anyhow = "1.0.104"
base64 = "0.22"
tracing = "0.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
