name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  signaling:
    name: signaling worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            signaling -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --version 0.8.7 --locked
      - name: Lint
        working-directory: signaling
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown
      - name: Build worker
        working-directory: signaling
        run: worker-build --release
      - working-directory: signaling
        run: npm ci
      - name: Build reemoth CLI
        run: cargo build -p reemoth
      - name: End-to-end ping against wrangler dev
        working-directory: signaling
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          W=$!
          up=
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/healthz && { up=1; break; }
            kill -0 $W 2>/dev/null || break
            sleep 2
          done
          [ -n "$up" ] || { echo "wrangler dev did not come up"; cat wrangler.log; exit 1; }
          ../target/debug/reemoth signal-ping --server ws://127.0.0.1:8787 --count 3 || { cat wrangler.log; exit 1; }
