name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  signaling:
    name: signaling worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            signaling -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --version 0.8.7 --locked
      - name: Lint
        working-directory: signaling
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown
      - name: Build worker
        working-directory: signaling
        run: worker-build --release
      - working-directory: signaling
        run: npm ci
      - name: Build reemoth CLI
        run: cargo build -p reemoth
      - name: End-to-end against wrangler dev
        working-directory: signaling
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          W=$!
          up=
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/healthz && { up=1; break; }
            kill -0 $W 2>/dev/null || break
            sleep 2
          done
          [ -n "$up" ] || { echo "wrangler dev did not come up"; cat wrangler.log; exit 1; }
          ../target/debug/reemoth signal-ping --signal ws://127.0.0.1:8787 --count 3 || { cat wrangler.log; exit 1; }
          bash ../scripts/e2e.sh ../target/debug/reemoth ws://127.0.0.1:8787 || { cat wrangler.log; exit 1; }

  release-binaries:
    name: binary (${{ matrix.name }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: reemoth.exe
          - name: linux-x86_64
            os: ubuntu-latest
            # The viewer loads X11/Wayland/GPU drivers at runtime, so it must be
            # a glibc build; zig pins the glibc version for old distros.
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.31
            file: reemoth
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.zig_target
        run: |
          pip install ziglang==0.15.1
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release -p reemoth --target ${{ matrix.zig_target }}
      - if: ${{ !matrix.zig_target }}
        run: cargo build --release -p reemoth --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: reemoth-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.file }}
